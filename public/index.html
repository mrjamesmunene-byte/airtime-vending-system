<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>James Airtime Vending</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f4f7fb}
*{box-sizing:border-box}body{margin:0;padding:24px 14px}.card{max-width:460px;margin:28px auto;background:white;padding:24px;border-radius:18px;box-shadow:0 8px 32px #16233a14}
h1{font-size:25px;margin:0 0 8px}.sub{color:#657187;margin:0 0 22px;font-size:14px}
label{display:block;font-weight:650;font-size:14px;margin:15px 0 6px}
input,select{width:100%;padding:13px;border:1px solid #cbd3df;border-radius:10px;font:inherit;background:#fff}
button{width:100%;border:0;border-radius:10px;padding:14px;background:#1458c8;color:white;font-weight:700;font-size:16px;margin-top:20px}
button:disabled{opacity:.55}.notice{font-size:12px;color:#6a7280;margin-top:16px;line-height:1.5}
#message{margin-top:16px;padding:12px;border-radius:10px;display:none;white-space:pre-wrap;font-size:14px}
.success{display:block!important;background:#eaf8ef;color:#176b37}.error{display:block!important;background:#fff0ee;color:#a42d21}
.brand{font-weight:750;color:#1458c8;letter-spacing:.2px;margin-bottom:10px}
</style>
</head>
<body>
<main class="card">
<div class="brand">JAMES AIRTIME VENDING</div>
<h1>Buy airtime</h1>
<p class="sub">Safaricom and Airtel • Pay securely with M-Pesa</p>
<form id="orderForm">
<label for="network">Network</label>
<select id="network" required><option value="SAFARICOM">Safaricom</option><option value="AIRTEL">Airtel</option></select>
<label for="recipient">Phone number to receive airtime</label>
<input id="recipient" type="tel" placeholder="07XXXXXXXX" autocomplete="tel" required>
<label for="amount">Airtime amount (KES)</label>
<input id="amount" type="number" min="10" max="10000" step="1" placeholder="e.g. 50" required>
<label for="payer">M-Pesa phone number to pay</label>
<input id="payer" type="tel" placeholder="07XXXXXXXX" autocomplete="tel" required>
<button id="payButton" type="submit">Continue to M-Pesa</button>
</form>
<div id="message" role="status"></div>
<p class="notice">Your order is only processed after M-Pesa confirms the exact payment. Do not share your M-Pesa PIN or one-time codes with anyone.</p>
</main>
<script>
const form=document.getElementById("orderForm"), button=document.getElementById("payButton"), message=document.getElementById("message");
function show(text,kind){message.textContent=text;message.className=kind}
form.addEventListener("submit",async event=>{
 event.preventDefault();button.disabled=true;button.textContent="Please wait…";message.className="";message.textContent="";
 try{
  const orderResponse=await fetch("/api/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
   network:document.getElementById("network").value,
   phoneNumber:document.getElementById("recipient").value,
   amount:document.getElementById("amount").value
  })});
  const orderData=await orderResponse.json();
  if(!orderResponse.ok)throw new Error(orderData.error||"Could not create order.");
  const paymentResponse=await fetch("/api/payments/stk-push",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
   orderReference:orderData.order.order_reference,
   payerPhone:document.getElementById("payer").value
  })});
  const paymentData=await paymentResponse.json();
  if(!paymentResponse.ok)throw new Error(paymentData.error||"Could not start M-Pesa payment.");
  show(paymentData.message+" Order reference: "+paymentData.orderReference,"success");
 }catch(error){show(error.message,"error")}
 finally{button.disabled=false;button.textContent="Continue to M-Pesa"}
});
</script>
</body>
</html>
